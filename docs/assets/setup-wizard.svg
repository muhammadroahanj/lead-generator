<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="690" fill="#06101d"/>
  <circle cx="1080" cy="80" r="230" fill="#06b6d4" opacity=".08"/>
  <circle cx="80" cy="650" r="260" fill="#22c55e" opacity=".06"/>
  <g filter="url(#shadow)">
    <rect x="55" y="42" width="1090" height="606" rx="16" fill="url(#bg)" stroke="#26364b"/>
    <rect x="55" y="42" width="1090" height="48" rx="16" fill="#1a2637"/>
    <rect x="55" y="74" width="1090" height="16" fill="#1a2637"/>
    <circle cx="84" cy="66" r="7" fill="#fb7185"/><circle cx="108" cy="66" r="7" fill="#fbbf24"/><circle cx="132" cy="66" r="7" fill="#4ade80"/>
    <text x="600" y="72" text-anchor="middle" fill="#8fa6bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">lead-scrapper-for-google-maps — setup</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="92" y="122" width="1016" height="92" rx="8" fill="#0b1524" stroke="#22d3ee"/>
    <text x="118" y="158" fill="#67e8f9" font-size="22" font-weight="700">Google Maps Lead Scraper</text>
    <text x="118" y="188" fill="#8293a8" font-size="16">Point it at any city or area, pick how deep to dig.</text>

    <text x="96" y="263" fill="#e5edf7" font-size="17" font-weight="700">? What do you want to scrape?</text>
    <rect x="91" y="281" width="665" height="38" rx="7" fill="#0e7490" opacity=".32"/>
    <text x="111" y="306" fill="#67e8f9" font-size="16">› Type any city or area (anywhere in the world)</text>
    <text x="111" y="345" fill="#8293a8" font-size="16">  Pick from the built-in US metro presets</text>

    <text x="96" y="406" fill="#e5edf7" font-size="17" font-weight="700">? Which businesses count as qualified leads?</text>
    <rect x="91" y="425" width="905" height="38" rx="7" fill="#166534" opacity=".30"/>
    <text x="111" y="450" fill="#86efac" font-size="16">› No website — businesses with no website at all</text>
    <text x="111" y="489" fill="#8293a8" font-size="16">  Has website but no discoverable email</text>
    <text x="111" y="528" fill="#8293a8" font-size="16">  All businesses — export everything, filter later</text>

    <text x="96" y="589" fill="#64748b" font-size="14">↑↓ move</text>
    <text x="205" y="589" fill="#64748b" font-size="14">space select</text>
    <text x="355" y="589" fill="#64748b" font-size="14">enter confirm</text>
    <rect x="915" y="563" width="180" height="40" rx="20" fill="#0891b2"/>
    <text x="1005" y="589" text-anchor="middle" fill="#ecfeff" font-size="14" font-weight="700">INTERACTIVE WIZARD</text>
  </g>
</svg>
